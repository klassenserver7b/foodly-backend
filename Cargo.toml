[package]
name = "foodly-backend"
version = "0.1.0"
edition = "2024"
default-run = "foodly-backend"

[dependencies]
anyhow = { version = "1.0" }
axum = { version = "0.8.9" }
dotenvy = { version = "0.15.7" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
diesel = { version = "2.3.14", default-features = false, features = ["postgres_backend", "32-column-tables", "chrono", "uuid"] }
diesel-async = { version = "0.9.2", default-features = false, features = ["postgres", "deadpool"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.54", features = ["full"] }
tower-http = { version = "0.7", features = ["cors", "trace"] }
sha2 = { version = "0.11" }
hex = { version = "0.4" }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
argon2 = { version = "0.6" }
rand = { version = "0.10" }
tower_governor = "0.8.0"
client-ip = "0.2.1"

[dev-dependencies]
http-body-util = { version = "0.1.3" }
tower = { version = "0.5.3", features = ["util"] }
